review_notes:
- INTERPRETATION. The decree states its bands in whole percentages ("up to 10%", then
  "11% to 20%"), which leaves gaps between 10% and 11%, 20% and 21%, 30% and 31%,
  and 40% and 41% undefined in the text. This encoding uses continuous bands with
  boundaries at 0.10, 0.20, 0.30 and 0.40, so a gap of 10.5% falls in the 5% band
  rather than the 0% band. A reviewer must confirm this reading before the rule is
  certified.
- 'BOUNDARY. Bands match on the first row whose upper bound covers the gap, so the
  upper bound is inclusive: a gap of exactly 0.10 permits no increase.'
- MARKET AVERAGE. "The average rental value of similar units" is determined by the
  RERA rental index. Bayyina computes its own comparable from the Dubai Land Department
  open contracts dataset and records the source on every evaluation. Our figure is
  not the official RERA index figure and is never described as one.
- SCOPE. Decree 43/2013 governs the permitted percentage. Whether an increase was
  validly notified is a separate question governed by Law 26/2007 Article 14 and answered
  by notice_validity.dubai.law_26_2007_a14.
- TRANSLATION. The verbatim text recorded here is an unofficial English translation.
  It must be checked against the Arabic original in the Official Gazette before this
  rule is certified.
- PROVENANCE. The URL is the publisher's site rather than a permanent link to the
  gazetted text. Record the permanent link before certification.
