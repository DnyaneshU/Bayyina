id: rent_increase.dubai.decree_43_2013
version: 1
jurisdiction: AE-DU
effective_from: 2013-12-09
effective_to: null
source:
  document_id: dubai_decree_43_2013
  title: Decree No. (43) of 2013 Determining Increases in Real Property Rent in the
    Emirate of Dubai
  clause: Article 1
  url: https://dubailand.gov.ae/
  verbatim: |
    The maximum rent increase for real property units in the Emirate of Dubai
    shall be determined as follows:

    1. no rent increase, where the rent for the real property unit is up to 10%
       less than the average rental value of similar units;

    2. 5% of the rent value for the real property unit, where the rent is 11% to
       20% less than the average rental value of similar units;

    3. 10% of the rent value for the real property unit, where the rent is 21%
       to 30% less than the average rental value of similar units;

    4. 15% of the rent value for the real property unit, where the rent is 31%
       to 40% less than the average rental value of similar units; and

    5. 20% of the rent value for the real property unit, where the rent is more
       than 40% less than the average rental value of similar units.
