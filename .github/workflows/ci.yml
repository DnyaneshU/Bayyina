name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Guardrail G7 in CI: a rule edited without re-signing fails the build.
      # This catches an honest mistake, not only an attack; the same check runs
      # again at service boot.
      #
      # No --allow-empty. The corpus exists now, so an empty rules/ means a
      # deleted file, a bad checkout, or a container build that did not copy it.
      # Each of those must turn CI red rather than pass quietly.
      - name: Verify rule corpus signatures
        run: python scripts/verify_corpus.py rules/

      - name: Test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The image is the deliverable at T1.9, so a Dockerfile that does not build is
  # a broken deploy discovered at the worst moment. This also runs the corpus
  # verification a third time, inside the image, where a missing rules/ COPY
  # would otherwise go unnoticed until boot.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bayyina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves a correct verdict
        run: |
          set -u

          # Whatever happens after this, show what the container said. A failing
          # smoke test with no logs is a failure you cannot act on.
          dump() {
            echo "::group::container logs"
            docker logs bayyina 2>&1 || echo "(no container)"
            echo "::endgroup::"
            echo "::group::container state"
            docker ps -a --filter name=bayyina || true
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' bayyina || true
            echo "::endgroup::"
          }
          trap dump EXIT

          docker run -d --name bayyina -p 8000:8000 bayyina:ci

          echo "--- waiting for the service ---"
          up=""
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then up=yes; break; fi
            if [ -z "$(docker ps -q --filter name=bayyina)" ]; then
              echo "the container exited before it served anything"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "the service never became reachable"; exit 1; fi

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8000/healthz -o health.json
          cat health.json; echo
          grep -q '"corpus_signed":true' health.json || { echo "corpus is not signed"; exit 1; }
          grep -q '"rule_count":2' health.json      || { echo "expected 2 rules"; exit 1; }

          echo "--- the interface is served from the same origin ---"
          curl -fsS http://127.0.0.1:8000/ -o index.html
          head -c 400 index.html; echo
          grep -q "Bayyina" index.html || { echo "the built frontend is not being served"; exit 1; }

          echo "--- /evaluate returns the verified demo verdict ---"
          BODY='{"rule_id":"rent_increase.dubai.decree_43_2013",'
          BODY=$BODY'"inputs":{"current_annual_rent":"80000","proposed_annual_rent":"96000","market_average_rent":"87000"},'
          BODY=$BODY'"input_sources":{"current_annual_rent":"caller_stated","proposed_annual_rent":"caller_stated","market_average_rent":"user_supplied"},'
          BODY=$BODY'"market":{"snapshot_id":"user_supplied"}}'

          curl -fsS -X POST http://127.0.0.1:8000/evaluate             -H 'Content-Type: application/json' -d "$BODY" -o verdict.json
          cat verdict.json; echo
          grep -q '"verdict":"not_permitted"' verdict.json || { echo "wrong verdict"; exit 1; }
          grep -q '"clause":"Article 1"' verdict.json      || { echo "citation missing"; exit 1; }

          echo "--- the container does not run as root ---"
          uid=$(docker exec bayyina id -u)
          echo "uid=$uid"
          [ "$uid" = "10001" ] || { echo "expected uid 10001"; exit 1; }

          echo "all container checks passed"
          docker rm -f bayyina
          trap - EXIT

      - name: A tampered corpus must fail the image build
        run: |
          RULE=backend/rules/rent_increase.dubai.decree_43_2013.v1.yaml
          sed -i 's/max_increase: 0.05/max_increase: 0.99/' "$RULE"

          if docker build -q -t bayyina:tampered . ; then
            echo "FAIL: the image built with a tampered rule"
            exit 1
          fi
          echo "OK: the build refused a tampered corpus"
