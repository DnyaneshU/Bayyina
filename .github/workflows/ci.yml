name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # `-c constraints.txt`: the floors in pyproject say what the code needs,
      # the constraints say what actually installs. Without this every run
      # resolves whatever was released that morning, and a green build turns red
      # with no change to our source - which is exactly what happened (D-087).
      - name: Install
        run: python -m pip install -c constraints.txt -e ".[dev]"

      - name: Constraints match the declared dependencies
        run: python scripts/refresh_constraints.py --check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Guardrail G7 in CI: a rule edited without re-signing fails the build.
      # This catches an honest mistake, not only an attack; the same check runs
      # again at service boot.
      #
      # No --allow-empty. The corpus exists now, so an empty rules/ means a
      # deleted file, a bad checkout, or a container build that did not copy it.
      # Each of those must turn CI red rather than pass quietly.
      - name: Verify rule corpus signatures
        run: python scripts/verify_corpus.py rules/

      - name: Test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build before Test, for two reasons. The styling tests read the built
      # stylesheet and will produce it themselves if it is missing, so this
      # ordering stops CI building the same bundle twice. It also means a broken
      # build is reported by the step named Build, rather than surfacing as a
      # timeout inside a test about colour contrast.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The image is the deliverable at T1.9, so a Dockerfile that does not build is
  # a broken deploy discovered at the worst moment. This also runs the corpus
  # verification a third time, inside the image, where a missing rules/ COPY
  # would otherwise go unnoticed until boot.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bayyina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What the container says on boot
        run: |
          # Run in the foreground so a startup traceback is printed directly.
          # Nothing is collapsed: a diagnostic inside a ::group:: is a diagnostic
          # nobody reads, which is how the previous failure told us nothing.
          echo "--- image entrypoint ---"
          docker inspect -f '{{json .Config.Cmd}}' bayyina:ci
          docker inspect -f 'user={{.Config.User}} workdir={{.Config.WorkingDir}}' bayyina:ci

          echo "--- can the package even be imported? ---"
          docker run --rm bayyina:ci python -c "import bayyina; print('bayyina', bayyina.__version__)" || true
          docker run --rm bayyina:ci python -c "import uvicorn; print('uvicorn', uvicorn.__version__)" || true

          echo "--- does the app build? ---"
          docker run --rm bayyina:ci python -c "
          from bayyina.api.app import create_app
          app = create_app()
          print('app built:', app.title, app.state.rule_count, 'rules')
          " || true

          echo "--- what is actually in the image? ---"
          docker run --rm bayyina:ci sh -c 'ls -la /app && echo "--- rules ---" && ls -la /app/rules && echo "--- static ---" && ls -la /app/static | head' || true

          echo "--- 10 seconds of uvicorn, in the foreground ---"
          timeout 10 docker run --rm bayyina:ci 2>&1 | head -60 || true

      - name: The container serves a correct verdict
        run: |
          set -u
          docker run -d --name bayyina -p 8000:8000 bayyina:ci

          echo "--- waiting for the service ---"
          up=""
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then up=yes; break; fi
            if [ -z "$(docker ps -q --filter name=bayyina)" ]; then
              echo "the container exited before it served anything. Its output:"
              docker logs bayyina 2>&1 | tail -60
              docker inspect -f 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' bayyina
              exit 1
            fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "the service never became reachable. Its output:"
            docker logs bayyina 2>&1 | tail -60
            exit 1
          fi

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8000/healthz -o health.json
          cat health.json; echo
          grep -q '"corpus_signed":true' health.json || { echo "corpus is not signed"; exit 1; }
          grep -q '"rule_count":2' health.json      || { echo "expected 2 rules"; exit 1; }

          echo "--- the interface is served from the same origin ---"
          curl -fsS http://127.0.0.1:8000/ -o index.html
          head -c 400 index.html; echo
          grep -q "Bayyina" index.html || { echo "the built frontend is not being served"; exit 1; }

          echo "--- /evaluate returns the verified demo verdict ---"
          BODY='{"rule_id":"rent_increase.dubai.decree_43_2013",'
          BODY=$BODY'"inputs":{"current_annual_rent":"80000","proposed_annual_rent":"96000","market_average_rent":"87000"},'
          BODY=$BODY'"input_sources":{"current_annual_rent":"caller_stated","proposed_annual_rent":"caller_stated","market_average_rent":"user_supplied"},'
          BODY=$BODY'"market":{"snapshot_id":"user_supplied"}}'

          curl -fsS -X POST http://127.0.0.1:8000/evaluate             -H 'Content-Type: application/json' -d "$BODY" -o verdict.json
          cat verdict.json; echo
          grep -q '"verdict":"not_permitted"' verdict.json || { echo "wrong verdict"; exit 1; }
          grep -q '"clause":"Article 1"' verdict.json      || { echo "citation missing"; exit 1; }

          echo "--- market data is absent here, and the image says so ---"
          # `comparables.duckdb` is gitignored, so a CI checkout has none. That is
          # a supported state (D-074), and the point of this check is that the
          # image degrades *honestly*: it names the missing dataset rather than
          # reporting healthy, and everything not depending on it still works.
          grep -q '"market_data_loaded":false' health.json || {
            echo "expected the image to report market data as absent"; exit 1; }
          grep -q '"status":"degraded"' health.json || {
            echo "a missing dataset must degrade status, not pass silently"; exit 1; }
          grep -q '"not_yet_checked":\[\]' health.json || {
            echo "nothing should still be deferred"; exit 1; }

          echo "--- and asking for a derived figure says how to fix it ---"
          code=$(curl -s -o comparables.json -w '%{http_code}'             'http://127.0.0.1:8000/comparables?area=Al%20Barsha%20First&kind=flat&bedrooms=2')
          cat comparables.json; echo
          [ "$code" = "503" ] || { echo "expected 503, got $code"; exit 1; }
          grep -q 'ingest_market' comparables.json || {
            echo "the 503 does not say how to build the database"; exit 1; }

          echo "--- the evidence pack renders inside the image ---"
          # `pip install .` copies .py and nothing else unless told otherwise,
          # so a missing package-data declaration produces a container that
          # boots, verifies its corpus, serves /healthz — and then fails on the
          # first evidence pack. The templates are not Python; this is the only
          # place that proves they made it in.
          docker run --rm bayyina:ci python -c "
          from pathlib import Path
          from bayyina.evidence.pack import build_pack, supported_languages
          from bayyina.registry.evaluator import Evaluator, MarketEvidence
          from bayyina.registry.loader import load_rules

          assert 'en' in supported_languages(), 'no evidence template survived the install'
          record = Evaluator(load_rules(Path('rules'))).evaluate(
              'rent_increase.dubai.decree_43_2013',
              {'current_annual_rent': '80000', 'proposed_annual_rent': '96000',
               'market_average_rent': '85000'},
              {'current_annual_rent': 'caller_stated', 'proposed_annual_rent': 'caller_stated',
               'market_average_rent': 'dld_open_rent_contracts_derived'},
              market=MarketEvidence(contract_count=5019, snapshot_id='s', age_days=30),
          )
          text = build_pack([record], 'CI-CHECK', 'en').render_text()
          for required in ('not an official determination', 'not legal advice',
                           'as stated by the caller', 'sha256:'):
              assert required in text.lower() or required in text, required
          print('evidence pack renders:', len(text), 'characters')
          "

          echo "--- the container does not run as root ---"
          uid=$(docker exec bayyina id -u)
          echo "uid=$uid"
          [ "$uid" = "10001" ] || { echo "expected uid 10001"; exit 1; }

          echo "all container checks passed"
          docker rm -f bayyina

      - name: A tampered corpus must fail the image build
        run: |
          RULE=backend/rules/rent_increase.dubai.decree_43_2013.v1.yaml
          sed -i 's/max_increase: 0.05/max_increase: 0.99/' "$RULE"

          if docker build -q -t bayyina:tampered . ; then
            echo "FAIL: the image built with a tampered rule"
            exit 1
          fi
          echo "OK: the build refused a tampered corpus"
